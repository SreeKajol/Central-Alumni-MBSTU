# Server Configuration
server.port=8081
spring.application.name=alumni-intelligence-service

# Database Configuration (Same as Laravel)
spring.datasource.url=jdbc:mysql://localhost:3306/alumni_system?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.edu.mbstu.alumni=DEBUG
logging.level.org.springframework.web=INFO

# CORS Configuration (Allow Laravel to communicate)
cors.allowed.origins=http://localhost:8000,http://127.0.0.1:8000

# Recommendation Engine Settings
recommendation.max.results=10
recommendation.similarity.threshold=0.3
